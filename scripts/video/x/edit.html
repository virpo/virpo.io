<!doctype html>
<meta charset="utf-8" />
<title>X cut</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@500;600;700;800;900&family=JetBrains+Mono:wght@500;600;700&display=swap" />
<!--
  The edit engine for the X cuts: a timeline of layers (stills, live clips, text, red pencil,
  rectangles) with keyframed boxes, camera views, opacity and wipes, rendered one frame at a time for
  director.mjs. DATA = { w, h, fps, bg, layers: [...] }; versions.mjs writes it per cut.
-->
<style>
  html, body { margin: 0; overflow: hidden; }
  #stage { position: absolute; left: 0; top: 0; overflow: hidden; perspective: 2400px; }
  #world { position: absolute; left: 0; top: 0; transform-style: preserve-3d; transform-origin: 0 0; }
  .L { position: absolute; overflow: hidden; }
  .L > img { position: absolute; left: 0; top: 0; max-width: none; }
  .L.html { overflow: visible; display: flex; }
  svg.L { overflow: visible; }
  .T { font-family: Figtree, system-ui, sans-serif; font-weight: 800; letter-spacing: -0.035em; line-height: 1.02; color: #1d1a17; }
  .T.paper { color: #faf7f2; }
  .T .o { color: #e8621c; }
  .M { font-family: "JetBrains Mono", ui-monospace, monospace; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: #1d1a17; }
  .chip { display: inline-block; padding: 0.22em 0.5em 0.26em; border-radius: 0.38em; background: #fffdf8; box-shadow: 0 0 0 1.5px rgba(60, 40, 20, .12), 0 14px 32px -14px rgba(40, 25, 10, .55); }
  .chip.dark { background: #1d1a17; color: #faf7f2; box-shadow: 0 14px 32px -14px rgba(20, 10, 5, .6); }
  .chip.o { background: #e8621c; color: #fff; }
</style>
<div id="stage"><div id="world"></div></div>
<script>
  const D = DATA;
  const FPS = D.fps ?? 30;
  const stage = document.getElementById("stage");
  const world = document.getElementById("world");
  Object.assign(stage.style, { width: `${D.w}px`, height: `${D.h}px`, background: D.bg ?? "#faf7f2" });
  Object.assign(world.style, { width: `${D.w}px`, height: `${D.h}px` });
  document.body.style.background = D.bg ?? "#faf7f2";

  const ease = {
    io: (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2),
    out: (t) => 1 - Math.pow(1 - t, 3),
    back: (t) => 1 + 2.2 * Math.pow(t - 1, 3) + 1.2 * Math.pow(t - 1, 2),
    lin: (t) => t,
  };
  const clamp01 = (t) => Math.max(0, Math.min(1, t));
  const mix = (a, b, u) => (Array.isArray(a) ? a.map((v, i) => v + (b[i] - v) * u) : a + (b - a) * u);
  // keys: [[t, value, easing?], ...] → value at t
  const at = (keys, t, fallback) => {
    if (keys === undefined) return fallback;
    if (!Array.isArray(keys) || !Array.isArray(keys[0])) return keys;
    if (t <= keys[0][0]) return keys[0][1];
    for (let i = 0; i < keys.length - 1; i++) {
      const [ta, va] = keys[i];
      const [tb, vb, e] = keys[i + 1];
      if (t <= tb) return mix(va, vb, (ease[e] ?? ease.io)(clamp01((t - ta) / (tb - ta || 1))));
    }
    return keys[keys.length - 1][1];
  };
  const FULL = [0, 0, D.w, D.h];

  // where an image's normalized point lands, for a layer with box B and view [fx, fy, zoom]
  function placement(L, t) {
    const B = at(L.box, t, FULL);
    const [fx, fy, z] = at(L.view, t, [0.5, 0.5, 1]);
    const iw = L.iw, ih = L.ih;
    const base = L.fit === "contain" ? Math.min(B[2] / iw, B[3] / ih) : Math.max(B[2] / iw, B[3] / ih);
    const s = base * z;
    const dw = iw * s, dh = ih * s;
    let ox = B[0] + B[2] / 2 - fx * dw;
    let oy = B[1] + B[3] / 2 - fy * dh;
    if (L.fit !== "contain" && L.clamp !== false) {
      ox = Math.min(B[0], Math.max(B[0] + B[2] - dw, ox));
      oy = Math.min(B[1], Math.max(B[1] + B[3] - dh, oy));
    }
    return { B, ox, oy, dw, dh };
  }
  const byId = {};
  const toOut = (ref, [u, v], t) => {
    const p = placement(byId[ref], t);
    return [p.ox + u * p.dw, p.oy + v * p.dh, p];
  };

  // a hand-drawn pencil loop round a box (in output px), drawn on over dur
  function pencilPath([x, y, w, h], seed) {
    const r = (k) => Math.sin(seed * 12.9898 + k * 78.233) * 0.5 + 0.5;
    const cx = x + w / 2, cy = y + h / 2;
    const pts = [];
    const turns = 1.12;
    for (let i = 0; i <= 64; i++) {
      const a = -Math.PI * 0.62 + (i / 64) * Math.PI * 2 * turns;
      const wob = 1 + (r(i) - 0.5) * 0.05 + (i / 64) * 0.06;
      pts.push([cx + Math.cos(a) * (w / 2) * wob, cy + Math.sin(a) * (h / 2) * wob]);
    }
    return "M" + pts.map((p) => p.map((v) => v.toFixed(1)).join(" ")).join(" L");
  }

  const SVGNS = "http://www.w3.org/2000/svg";
  for (const [k, L] of D.layers.entries()) {
    L.k = k;
    if (L.id) byId[L.id] = L;
    if (L.type === "img" || L.type === "seq") {
      L.el = document.createElement("div");
      L.el.className = "L";
      L.img = document.createElement("img");
      L.el.appendChild(L.img);
      if (L.radius) L.el.style.borderRadius = typeof L.radius === "string" ? L.radius : `${L.radius}px`;
      if (L.shadow) L.el.style.boxShadow = L.shadow;
    } else if (L.type === "html") {
      L.el = document.createElement("div");
      L.el.className = "L html";
      L.el.innerHTML = L.html;
      Object.assign(L.el.style, { alignItems: L.align ?? "center", justifyContent: L.justify ?? "center", textAlign: L.textAlign ?? "center" });
    } else if (L.type === "rect") {
      L.el = document.createElement("div");
      L.el.className = "L";
      L.el.style.background = L.color ?? "#000";
      if (L.radius) L.el.style.borderRadius = typeof L.radius === "string" ? L.radius : `${L.radius}px`;
      if (L.shadow) L.el.style.boxShadow = L.shadow;
    } else if (L.type === "pencil" || L.type === "tick") {
      L.el = document.createElementNS(SVGNS, "svg");
      L.el.setAttribute("class", "L");
      Object.assign(L.el.style, { left: "0", top: "0", width: `${D.w}px`, height: `${D.h}px` });
      L.path = document.createElementNS(SVGNS, "path");
      Object.assign(L.path.style, { fill: "none", stroke: L.color ?? "rgba(205, 40, 34, .92)", strokeWidth: L.width ?? 9, strokeLinecap: "round", strokeLinejoin: "round", filter: "drop-shadow(0 1px 0 rgba(120,20,10,.25))" });
      L.el.appendChild(L.path);
    }
    // fixed layers (a background) stay put behind the scene when it leans
    if (L.fixed) stage.insertBefore(L.el, world);
    else world.appendChild(L.el);
  }

  window.ready = async () => {
    await Promise.all(D.layers.filter((L) => L.type === "img" || L.type === "seq").map((L) => new Promise((ok) => {
      const probe = new Image();
      probe.onload = () => { L.iw = probe.naturalWidth; L.ih = probe.naturalHeight; ok(); };
      probe.onerror = () => { console.error("missing", probe.src); L.iw = 16; L.ih = 9; ok(); };
      probe.src = L.type === "img" ? L.src : `${L.dir}/f0000.jpg`;
    })));
    await document.fonts.ready;
  };

  // in/out transitions: fade, pop, up, down, left, right, wipeR, wipeL, wipeD
  function transition(L, t) {
    let o = 1, tx = 0, ty = 0, sc = 1, clip = null;
    const apply = (tr, u, entering) => {
      if (!tr) return;
      const k = entering ? u : 1 - u;
      const kind = tr.type ?? tr;
      if (kind === "fade") o *= k;
      if (kind === "pop") { o *= clamp01(k * 3); sc *= 0.7 + 0.3 * (entering ? ease.back(u) : k); }
      const dist = tr.dist ?? 60;
      if (kind === "up") { o *= k; ty += (1 - k) * dist; }
      if (kind === "down") { o *= k; ty -= (1 - k) * dist; }
      if (kind === "left") tx += (1 - k) * (entering ? D.w : -D.w);
      if (kind === "right") tx -= (1 - k) * (entering ? D.w : -D.w);
      if (kind === "wipeR") clip = `inset(0 ${(1 - k) * 100}% 0 0)`;
      if (kind === "wipeL") clip = `inset(0 0 0 ${(1 - k) * 100}%)`;
      if (kind === "wipeD") clip = `inset(0 0 ${(1 - k) * 100}% 0)`;
    };
    const din = L.in?.dur ?? 0.3, dout = L.out?.dur ?? 0.3;
    if (L.in && t < L.t0 + din) apply(L.in, ease.out(clamp01((t - L.t0) / din)), true);
    if (L.out && L.t1 !== undefined && t > L.t1 - dout) apply(L.out, ease.io(clamp01((t - (L.t1 - dout)) / dout)), false);
    return { o, tx, ty, sc, clip };
  }

  window.render = async (frame) => {
    const t = frame / FPS;
    const jobs = [];
    // the whole scene can lean: world: [[t, [rotateX, rotateY, scale]]] about the middle
    if (D.world) {
      const [rx, ry, sc] = at(D.world, t, [0, 0, 1]);
      world.style.transform = `translate(${D.w / 2}px, ${D.h / 2}px) rotateX(${rx}deg) rotateY(${ry}deg) scale(${sc}) translate(${-D.w / 2}px, ${-D.h / 2}px)`;
    }
    for (const L of D.layers) {
      const on = t >= (L.t0 ?? 0) && (L.t1 === undefined || t < L.t1);
      L.el.style.display = on ? "" : "none";
      if (!on) continue;
      const tr = transition(L, t);
      const op = at(L.opacity, t, 1) * tr.o;
      L.el.style.opacity = String(op);
      L.el.style.clipPath = tr.clip ?? at(L.clip, t, "none");
      if (L.type === "img" || L.type === "seq") {
        const { B, ox, oy, dw, dh } = placement(L, t);
        Object.assign(L.el.style, { left: `${B[0]}px`, top: `${B[1]}px`, width: `${B[2]}px`, height: `${B[3]}px`, transform: `translate(${tr.tx}px, ${tr.ty}px) scale(${tr.sc})` });
        Object.assign(L.img.style, { left: `${ox - B[0]}px`, top: `${oy - B[1]}px`, width: `${dw}px`, height: `${dh}px` });
        const src = L.type === "img" ? L.src : (() => {
          const speed = L.speed ?? 1;
          let i = Math.floor((t - (L.t0 ?? 0)) * (L.fps ?? 30) * speed + 1e-6) + (L.start ?? 0);
          if (L.loop) i = ((i % L.n) + L.n) % L.n;
          i = Math.max(0, Math.min(L.n - 1, i));
          return `${L.dir}/f${String(i).padStart(4, "0")}.jpg`;
        })();
        if (L.img.getAttribute("src") !== src) {
          L.img.setAttribute("src", src);
          jobs.push(L.img.decode().catch(() => {}));
        }
      } else if (L.type === "html" || L.type === "rect") {
        const B = at(L.box, t, FULL);
        Object.assign(L.el.style, { left: `${B[0]}px`, top: `${B[1]}px`, width: `${B[2]}px`, height: `${B[3]}px`, transform: `translate(${tr.tx}px, ${tr.ty}px) scale(${tr.sc})` });
        if (L.steps) {
          let html = L.steps[0][1];
          for (const [ts, h] of L.steps) if (t >= ts) html = h;
          if (L.el.innerHTML !== html) L.el.innerHTML = html;
        }
      } else if (L.type === "pencil" || L.type === "tick") {
        // the box follows an image layer when it has `on` (normalized rect in that image)
        let box = L.rect;
        if (L.on) {
          const [x0, y0] = toOut(L.on, [L.rect[0], L.rect[1]], t);
          const [x1, y1] = toOut(L.on, [L.rect[0] + L.rect[2], L.rect[1] + L.rect[3]], t);
          box = [x0, y0, x1 - x0, y1 - y0];
        }
        const d = L.type === "tick"
          ? `M${box[0]} ${box[1] + box[3] * 0.55} L${box[0] + box[2] * 0.38} ${box[1] + box[3]} L${box[0] + box[2]} ${box[1]}`
          : pencilPath(box, L.k + 1);
        if (L.path.getAttribute("d") !== d) L.path.setAttribute("d", d);
        const len = L.path.getTotalLength();
        const u = ease.out(clamp01((t - L.t0) / (L.dur ?? 0.45)));
        L.path.style.strokeDasharray = `${len} ${len}`;
        L.path.style.strokeDashoffset = String(len * (1 - u));
      }
    }
    await Promise.all(jobs);
  };
</script>
